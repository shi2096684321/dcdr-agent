    <h1>城市轨道交通新线开通运营_城市新闻</h1>
    <p class="time">2026-10-28 09:00</p>
    <p>轨道交通新线于今日上午正式开通初期运营，全线共设车站二十三座，其中换乘站八座，线路全长三十一点六公里。开通后，沿线居民前往中心城区的通勤时间预计缩短约二十五分钟。</p>
    <p>运营方表示，初期行车间隔为六分钟，后续将根据客流情况逐步加密。新线采用全自动运行系统，列车可在无人值守状态下完成折返与出入库作业，这是本市首条全自动运行线路。</p>
    <p>为配合新线开通，沿线新增接驳公交线路十一条，并在主要站点设置非机动车停放区。运营方提醒乘客，开通首周客流量较大，建议错峰出行。</p>
