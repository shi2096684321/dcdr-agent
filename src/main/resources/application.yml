server:
  port: 8080

spring:
  application:
    name: java-agent

  # H2 数据库配置(开发期)
  datasource:
    url: jdbc:h2:file:./data/database/agent;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # WebFlux 配置
  codec:
    max-in-memory-size: 16MB

# ===== Agent 核心配置 =====
agent:
  name: "JavaAgent"

  # 记忆配置
  memory:
    max-messages: 20
    storage: memory
    # 上下文上限提示: 估算 token 达到上限的 warn-ratio 时, 建议用户开启新对话
    context-token-limit: 8000
    context-warn-ratio: 0.8

  # 文件存储配置
  storage:
    base-dir: ./data
    image-dir: ./data/images
    video-dir: ./data/videos
    upload-dir: ./data/uploads
    upload-url-prefix: /api/files/uploads
    generated-dir: ./data/generated

  # 模型配置
  models:
    default-chat: "openai-chat"

    chat:
      - name: "openai-chat"
        enabled: true
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com"
        model: "gpt-4o"
        temperature: 0.7
        max-tokens: 2000
        capabilities:
#          - vision
#          - function_calling

      - name: "zhipu-chat"
        enabled: true
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "glm-4-plus"
        temperature: 0.7
        capabilities:
#          - function_calling

      - name: "qwen-chat"
        enabled: true
        provider: "qwen"
        api-key: "sk-68a97d79d1f5479491be3ae83fa4655c"
        base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        model: "qwen3.7-max-2026-06-08"
        capabilities:
#          - vision
          - function_calling

      - name: "deepseek-chat"
        enabled: true
        provider: "deepseek"
        api-key: "sk-b8bb098d0a3a45508f86d7b5c8cd1b34"
        base-url: "https://api.deepseek.com"
        model: "deepseek-v4-flash"
        capabilities:
          - function_calling

    image:
      - name: "qwen-image"
        enabled: true
        provider: "qwen"
        #        api-key: ${DASHSCOPE_API_KEY:demo-key}
        api-key: "sk-68a97d79d1f5479491be3ae83fa4655c"
        base-url: "https://dashscope.aliyuncs.com"
        model: "qwen-image-2.0-pro-2026-06-22"
        size: "1024x1024"

      - name: "openai-image"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com"
        model: "dall-e-3"
        size: "1024x1024"

      - name: "zhipu-image"
        enabled: false
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "cogview-3"

    video:
      - name: "kling-video"
        enabled: true
        provider: "kuaishou"
        api-key: ${KLING_API_KEY:demo-key}
        base-url: "https://api.klingai.com"
        model: "kling-v1"

      # 阿里云百炼 通义万相2.7 文生视频(新版协议, 仅支持 wan2.7 系列)
      # 配置有效 DASHSCOPE_API_KEY(即百炼 API Key) 后将 enabled 改为 true
      # 如需北京地域专属域名可改 base-url 为 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
      - name: "wan-video"
        enabled: true
        provider: "wan"
#        api-key: ${DASHSCOPE_API_KEY:demo-key}
        api-key: "sk-68a97d79d1f5479491be3ae83fa4655c"
        base-url: "https://dashscope.aliyuncs.com"
        model: "wan2.7-t2v-2026-06-12"
        model-i2v: "happyhorse-1.1-i2v"   # 图生视频(i2v)专用模型名

    # 语音模型 (STT/TTS), V1.1 新增; 配置有效 OPENAI_API_KEY 后将 enabled 改为 true
    audio:
      - name: "openai-audio"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com"
        model: "whisper-1"

      # 阿里云百炼 Sambert 语音合成 (仅 TTS); 配置有效 DASHSCOPE_API_KEY 后将 enabled 改为 true
      # 注意: 百炼语音合成不支持本地音频 STT, 语音识别仍请使用 openai-audio
      - name: "qwen-audio"
        enabled: false
        provider: "qwen"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com"
        model: "sambert-zhide-v1"

# 工具配置
agent-tools:
  weather:
    enabled: true
    api-key: ${WEATHER_API_KEY:demo-key}
    base-url: "https://restapi.amap.com/v3/weather/weatherInfo"
  calculator:
    enabled: true
  time:
    enabled: true

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
  packages-to-scan: com.dcdr.agent.controller
  default-flat-param-object: true

# 日志
logging:
  level:
    com.example.agent: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
