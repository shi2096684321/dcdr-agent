server:
  port: 8080

spring:
  application:
    name: dcdr-agent

  # 默认不激活额外 profile (走 application.yml 的 H2); 设置 SPRING_PROFILES_ACTIVE=pg 即切 PostgreSQL
  profiles:
    active: pg
  #    active: ${SPRING_PROFILES_ACTIVE:default}
  # H2 数据库配置(开发期)
  datasource:
    url: jdbc:h2:file:./data/database/agent;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # WebFlux 配置
  codec:
    max-in-memory-size: 16MB

# ===== Agent 核心配置 =====
agent:
  name: "JavaAgent"

  # ── System Prompt 架构（两个正交维度）──────────────────────────────
  # 维度一 · Base System Prompt（静态基线）：L1 全局 < L2 场景级 < L3 会话级
  #   - L1 全局 default-prompt：所有场景兜底
  #   - L2 场景级 scenes.*：按 chat / text-to-image / image-to-image 注入
  #   - L3 会话级 SessionEntity.systemPrompt（DB 持久化）：聊天场景用户可定制，覆盖 L2/chat
  #   长文本建议外置到 classpath:prompts/*.txt，用 *-location 字段引用；内联字段优先。
  # 维度二 · Runtime 运行时约束（平台动态增强，不持久化，与 Base 层级正交）：
  #   由平台按运行时状态（联网搜索开关/多轮/生图工具）动态注入，每项 name(去重键)+text/text-location。
  # 聊天场景：维度一解析结果作为 system 消息插入 history 头部（OpenAI 兼容）。
  # 文生图/图生图：维度一作为前置增强拼到用户 prompt 前（图像模型不支持 system 消息）。
  system-prompt:
    # L1 全局默认（所有场景兜底，可为空）
#    default-prompt: "你是一位全能的工作助手，你的名字叫dcdr（多吃点肉）,小名叫多肉。是石准将你创造出来的。不用每次回答都介绍自己"
    scenes:
      # 聊天场景：长文本外置到文件，改 prompt 只改 prompts/chat.txt 即可
      chat-location: "classpath:prompts/chat.md"
      # 也可内联覆盖（内联优先于 chat-location）：chat: "..."
      # 文生图场景增强（拼到用户 prompt 前）
      text-to-image: ""
      # 图生图场景增强（通常强调保持参考图主体）
      image-to-image: ""

    # 维度二 · Runtime 运行时约束（每项 name=去重键；text 内联优先，text-location 文件优先于内置默认）
    runtime:
      # 生图策略：约束只生成本轮新请求的图片，不重复历史已完成的图片
      image-policy:
        name: "runtime:image-policy"
        text-location: "classpath:prompts/runtime-image-policy.md"
      # 联网搜索引导：用户开启联网搜索时的检索与引用规范
      web-search:
        name: "runtime:web-search"
        text-location: "classpath:prompts/runtime-web-search.md"
      # 多轮对话规范：只回答当前提问、历史仅作参考，避免重复历史答案
      multi-turn:
        name: "runtime:multi-turn"
        text-location: "classpath:prompts/runtime-multi-turn.md"
      # RAG 知识库检索增强引导(用户选择知识库时注入, 检索片段由代码动态拼接)
      rag-context:
        name: "runtime:rag-context"
        text-location: "classpath:prompts/runtime-rag-context.md"

  # 记忆配置
  memory:
    max-messages: 6
    storage: memory
    # 上下文上限提示: 估算 token 达到上限的 warn-ratio 时, 建议用户开启新对话
    context-token-limit: 8000
    context-warn-ratio: 0.8

  # ===== V2.2 用户认证配置 =====
  # enabled=false 时所有接口免鉴权(兼容 V2.1 单用户场景); 生产环境务必 enabled=true
  auth:
    enabled: true
    jwt:
      # HMAC-SHA256 密钥(>=32 字节); 生产环境通过环境变量 JWT_SECRET 注入, 避免硬编码泄露
      secret: ${JWT_SECRET:dcdr-agent-v22-default-secret-key-change-me-in-production-please-32bytes}
      access-ttl: 24h
      refresh-ttl: 7d
      issuer: dcdr-agent
    login-lock:
      max-failures: 5
      lock-ttl: 30m
    permit-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/models
      - /v3/api-docs
      - /swagger-ui
      - /h2-console
      # 上传文件匿名访问: 用 Ant 通配 /** 放行所有子路径(图片 URL 形如 /api/files/uploads/2026/08/31/xxx.png)。
      # 仅写 /api/files/uploads(无 /**) 时, SecurityConfig.authorizeExchange 的 Ant pathMatchers 不匹配子路径,
      # 子路径会落到下方 /api/** authenticated() 被拦, 而浏览器 <img> 不带 token 导致 401 加载失败。
      - /api/files/uploads/**
      - /api/files/generated/**
      - /api/files/videos/**
      # F-40.2 健康检查/指标采集: 供负载均衡探活与 Prometheus 抓取 (部署于内网)
      - /actuator/health
      - /actuator/readiness
      - /actuator/liveness
      - /actuator/prometheus

  # ===== V2.1 RAG 知识库配置 =====
  # 仅在 pg profile 下生效真实向量检索; H2 默认 profile 不支持 pgvector,
  # 上传/检索会因 VectorType 列无法识别而失败, 请切换 --spring.profiles.active=pg
  rag:
    enabled: false
    # 平台级知识库 ID 列表(visibility=PLATFORM): 对所有对话无感可用, 用户无需选择
    # 管理员将知识库 visibility 设为 PLATFORM 后, 把 ID 填入此处即可全局生效
    platform-kb-ids: ["kb_1786443109991fff8909"]
    storage-dir: ./data/kb
    document:
      max-file-size: 20MB
      supported-formats: [pdf, docx, txt, md, markdown, html, htm]
      max-docs-per-kb: 100
    splitter:
      strategy: recursive
      chunk-size: 1000
      chunk-overlap: 200
    embedding:
      # 默认 Embedding provider; 维度必须 = 1536 (与 document_chunks.embedding VECTOR(1536) 一致)
      default-provider: qwen-embedding
      providers:
        # provider = 厂商(qwen/zhipu/openai); engine 约定同 models(langchain4j 默认 / manual 回退)
        # 通义 DashScope text-embedding-v4 (Qwen3-Embedding, 支持 1536 维, 与 schema VECTOR(1536) 对齐)
        # 注: v3 仅支持 1024/768/512 维, 传 1536 会 400; v4 是推荐模型, 支持 1536 且多语种更强
        - name: qwen-embedding
          enabled: true
          provider: qwen
          api-key: ${DASHSCOPE_API_KEY:demo-key}
          base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
          model: qwen3.7-text-embedding
          dimensions: 1536
          # v4 单次请求最大 10 条(官方限制), v3 为 25; 此处按 v4 限制
          batch-size: 10
        # OpenAI text-embedding-3-small (1536 维); 配置有效 OPENAI_API_KEY 后启用
        # base-url 约定(两引擎一致): 版本段由 base-url 携带, 引擎在其后追加 /embeddings
        - name: openai-embedding
          enabled: false
          provider: openai
          api-key: ${OPENAI_API_KEY:sk-demo-key}
          base-url: https://api.openai.com/v1
          model: text-embedding-3-small
          dimensions: 1536
          batch-size: 100
        # 智谱 embedding-2 (1024 维, 与 schema VECTOR(1536) 不匹配, 启用前需同步改 schema 维度)
        - name: zhipu-embedding
          enabled: false
          provider: zhipu
          api-key: ${ZHIPU_API_KEY:demo-key}
          base-url: https://open.bigmodel.cn/api/paas/v4
          model: embedding-2
          dimensions: 1024
          batch-size: 64
    vector-store:
      type: pgvector
    retrieval:
      top-k: 5
      min-score: 0.3
    # ===== V2.1 OCR 扫描版 PDF 文本提取 =====
    # 关闭时扫描版 PDF 直接报错(原 PdfReader 行为); 开启后自动降级调 qwen3.5-ocr
    # 复用 DASHSCOPE_API_KEY, 走 OpenAI 兼容协议 /chat/completions
    # 触发条件: PDFBox 抽取的"每页平均字符数" < threshold-chars-per-page 时判定为扫描版
    ocr:
      enabled: true
      api-key: ${DASHSCOPE_API_KEY:demo-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen3.5-ocr
      threshold-chars-per-page: 50
      max-pages: 50
      timeout-seconds: 300
      # 留空使用模型默认 prompt("只输出图像中的文本内容, 不附加描述或格式")
      prompt: ""

  # 文件存储配置
  storage:
    base-dir: ./data
    image-dir: ./data/images
    video-dir: ./data/videos
    upload-dir: ./data/uploads
    upload-url-prefix: /api/files/uploads
    generated-dir: ./data/generated

  # 模型配置
  models:
    default-chat: "qwen-chat"

    # provider = 厂商(qwen/zhipu/deepseek/openai/ollama), 用于 /api/models 展示与 manual 模式分发
    # engine 说明:
    #   langchain4j = 框架内核(默认, 适配任意 OpenAI 兼容端点, 在 base-url 后追加 /chat/completions)
    #   manual = 手写 WebClient 实现(回退选项)
    # 切换引擎只需改 engine 值
    chat:
      - name: "openai-chat"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        # base-url 约定(两引擎一致): 版本段由 base-url 携带, 引擎在其后追加 /chat/completions
        base-url: "https://api.openai.com/v1"
        model: "gpt-4o"
        temperature: 0.7
        max-tokens: 2000
        capabilities:
#          - vision
#          - function_calling

      - name: "zhipu-chat"
        enabled: true
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "glm-4-plus"
        temperature: 0.7
        capabilities:
          - function_calling

      - name: "qwen-chat"
        enabled: true
        provider: "qwen"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        model: "qwen3.7-flash-2026-07-15"
        capabilities:
#          - vision
          - function_calling

      - name: "deepseek-chat"
        enabled: true
        provider: "deepseek"
        api-key: ${DEEPSEEK_API_KEY:demo-key}
        base-url: "https://api.deepseek.com"
        model: "deepseek-v4-flash"
        capabilities:
          - function_calling

      # V3.0-rc F-38 本地模型: Ollama OpenAI 兼容端点 (私有化部署, 数据不出内网)
      # 前置: 安装 Ollama 并拉取模型 (ollama pull qwen3:8b), 然后 enabled 改 true
      - name: "ollama-chat"
        enabled: false
        provider: "ollama"
        # Ollama 本地无需鉴权, 占位即可
        api-key: "ollama"
        # Ollama 原生 OpenAI 兼容端点 (端口 11434, 需带 /v1)
        base-url: "http://localhost:11434/v1"
        model: "qwen3:8b"
        capabilities:
          - function_calling

    # provider = 厂商(qwen/zhipu/openai); engine 约定同 chat(langchain4j 默认 / manual 回退)
    # base-url 约定(两引擎一致): 版本段(/v1 等)由 base-url 携带, 路径只含资源部分, 切换引擎无需改地址
    #   智谱: https://open.bigmodel.cn/api/paas/v4 (cogview 系列)
    #   OpenAI: https://api.openai.com/v1 (dall-e 系列)
    # qwen 例外(端点本质不同, 配双地址):
    #   base-url        = langchain4j 引擎用 compatible-mode(注: DashScope 生图无兼容端点, 实测 404, 仅留作切换)
    #   manual-base-url = manual 引擎用 DashScope 原生根地址(multimodal-generation)
    image:
      - name: "qwen-image"
        enabled: true
        provider: "qwen"
        engine: "manual"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        manual-base-url: "https://dashscope.aliyuncs.com"
        model: "qwen-image-2.0-pro-2026-06-22"
        size: "1024x1024"

      - name: "openai-image"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com/v1"
        model: "dall-e-3"
        size: "1024x1024"

      - name: "zhipu-image"
        enabled: false
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "cogview-3"

    video:
      - name: "kling-video"
        enabled: true
        provider: "kuaishou"
        api-key: ${KLING_API_KEY:demo-key}
        base-url: "https://api.klingai.com"
        model: "kling-v1"

      # 阿里云百炼 通义万相2.7 文生视频(新版协议, 仅支持 wan2.7 系列)
      # 配置有效 DASHSCOPE_API_KEY(即百炼 API Key) 后将 enabled 改为 true
      # 如需北京地域专属域名可改 base-url 为 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
      - name: "wan-video"
        enabled: true
        provider: "wan"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com"
        model: "wan2.7-t2v-2026-06-12"
        model-i2v: "happyhorse-1.1-i2v"   # 图生视频(i2v)专用模型名

    # 语音模型 (STT/TTS), V1.1 新增; 配置有效 OPENAI_API_KEY 后将 enabled 改为 true
    # provider = 厂商; engine 约定同 chat(langchain4j 默认 / manual 回退)
    # base-url 约定(两引擎一致): 版本段由 base-url 携带, 引擎在其后追加 /audio/*
    audio:
      - name: "openai-audio"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com/v1"
        model: "whisper-1"

      # 阿里云百炼 Sambert 语音合成 (仅 TTS); 配置有效 DASHSCOPE_API_KEY 后将 enabled 改为 true
      # 注意: 百炼语音合成不支持本地音频 STT, 语音识别仍请使用 openai-audio
      - name: "qwen-audio"
        enabled: false
        provider: "qwen"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com"
        model: "sambert-zhide-v1"

  # ===== V3.0-alpha 配置 (F-30 智能路由 / F-31 触发层 / F-33 执行容错) =====
  v3:
    # F-30 智能路由层: LLM 自动判断用户意图, 路由到工作流/Agent/普通对话
    smart-routing:
      enabled: true
      # 置信度阈值 (0~1), 低于此值回退普通对话, 避免误路由
      confidence-threshold: 0.6
      # 路由用的模型名 (留空用系统默认对话模型; 建议用低成本模型降低延迟与费用)
      model: ""
      # 路由过程是否对用户可见 (下发"已自动选择 XX"提示)
      visible-hint: true
      # LLM 结构化输出约束
      #   json_object: 强制输出合法 JSON (默认, 兼容性最好 Qwen/DeepSeek/GLM/OpenAI)
      #                仅保证"是合法JSON", 不保证字段名/结构; 靠 prompt + 解析校验兜底
      #   json_schema: 按 JSON Schema strict 强约束字段 (字段名/类型/枚举/必填全保证)
      #                需模型支持 strict 模式 (gpt-4o / qwen-max 较新版 / 其他不保证)
      #                不支持的模型会返回 400, 切换前请确认路由模型能力
      #   tool_call:   把期望输出包装为工具并强制调用, 从 tool_calls arguments 取符合 schema 的 JSON
      #                schema 级保证, 国产模型 function calling 普遍支持 (Qwen/DeepSeek/GLM 推荐此模式)
      #                需模型支持 function calling
      #   留空: 不约束, 仅靠 prompt
      response-format: json_object
    # F-33 执行容错: 步骤未显式配置重试时的默认策略
    execution:
      retry:
        default-max-attempts: 3
        # 退避策略: fixed / linear / exponential
        backoff: exponential
        initial-delay-ms: 1000
        multiplier: 2.0
    # F-31 Webhook 触发层
    webhook:
      # Webhook 触发 URL 外部基址 (回显给用户用); 留空回显相对路径
      # 生产环境应填完整外网地址, 如: https://api.example.com/api/webhooks/trigger
      base-url: ""
    # F-39 成本与配额管理 (V3.0-beta): 用户级日/月 token 限额 + 工作流单次执行限额
    quota:
      # 是否启用配额拦截; 关闭时不做任何限额检查 (仅统计用量)
      enabled: false
      # 用户级: 单日 token 上限 (0 = 不限)
      daily-tokens: 100000
      # 用户级: 单月 token 上限 (0 = 不限)
      monthly-tokens: 2000000
      # 工作流级: 单次执行 token 上限 (0 = 不限); 超出时该执行标记 failed
      workflow-max-tokens-per-execution: 50000

    # ===== V3.0-rc 生产化加固 (F-40.3/F-40.4) =====
    # F-40.3 API 限流: 固定窗口计数, 用户+IP 双维度 (未登录按 IP)
    rate-limit:
      enabled: false
      # 登录用户每分钟请求上限
      user-requests-per-minute: 60
      # 匿名/按 IP 每分钟请求上限 (保护未认证接口)
      ip-requests-per-minute: 120

    # F-40.4 LLM 熔断: 按模型名统计失败率, 开断后快速失败 503
    circuit-breaker:
      enabled: false
      # 开断失败率阈值 (0~1, 窗口内调用数需达到 min-calls)
      failure-rate-threshold: 0.5
      # 统计窗口内最小调用数 (小样本不判定)
      min-calls: 10
      # 开断持续时间 (ms), 之后进入半开放行一次探测
      wait-open-ms: 30000

    # ===== V3.0-rc 业务能力 (F-36/F-37) =====
    # F-36 多租户: 租户级资源配额 (租户/成员由 TenantController 管理)
    tenant:
      enabled: false

    # F-37 插件系统: 外部 JAR 插件加载 (./plugins 目录)
    plugin:
      enabled: false
      # 插件目录 (相对工作目录)
      dir: "./plugins"
      # 危险 API 审计: 扫描插件字节码, 发现 Runtime/ProcessBuilder/反射特征即拒绝加载
      block-dangerous: true

# 工具配置
agent-tools:
  weather:
    enabled: true
    api-key: ${WEATHER_API_KEY:demo-key}
    base-url: "https://restapi.amap.com/v3/weather/weatherInfo"
  calculator:
    enabled: true
  time:
    enabled: true

# ===== MCP Server 连接配置 (本应用作为 Host, 连接外部 MCP Server) =====
# 只需写 Client 去访问别人提供的 MCP Server, 不需要自己起 Server。
# 下面为示例(默认注释): 启用时去掉注释, 并把 command 换成你实际可用的 MCP Server 启动命令。
# 注意: command 为 stdio 启动命令, 系统需能执行 npx/python 等。
mcp:
  servers:
    - name: web-search
      # Tavily 官方 MCP Server (stdio, 由 npx 拉起)
      # 需设置环境变量 TAVILY_API_KEY(如下), 否则 Server 启动后调用会报错:
      #   Windows(PowerShell):  $env:TAVILY_API_KEY='tvly-xxx'
      #   Linux/macOS:          export TAVILY_API_KEY='tvly-xxx'
      # 注: npx 拉起的子进程会继承本应用的环境变量, 故在启动 dcdr-agent 前设置即可
      command: ["D:\\app\\nodejs\\npx.cmd", "-y", "tavily-mcp@0.2.1"]
      # 该 Server 暴露的工具名, 允许在流式对话中被调用
      streaming-tools: ["tavily-search", "tavily-extract"]
      # 把第三方工具名对齐到本项目约定: tavily-search -> web_search
      # 这样 AgentOrchestrator / 前端开关(都按 web_search 判断)无需改动
      aliases:
        tavily-search: web_search
        tavily-extract: web_extract

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
  packages-to-scan: com.dcdr.agent.controller,com.dcdr.agent.auth.contorller
  default-flat-param-object: true

# 日志
# F-40.12: 控制台格式带 traceId/spanId (Micrometer Tracing 开启时自动填充 MDC, 未开启时显示空)
logging:
  level:
    com.dcdr.agent: info
    org.springframework.ai: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [${traceId:-},${spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [${traceId:-},${spanId:-}] %logger{36} - %msg%n"
  file:
    name: ./logs/dcdr-agent.log
  logback:
    rollingpolicy:
      # F-40.6 日志轮转: 单文件 100MB, 保留 30 天 / 总量 2GB
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 2GB

# ===== F-40.2 / F-40.12 生产化加固: Actuator + 追踪 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      # 采样率 (0~1): 生产默认 0.1, 排障时可临时调 1.0
      probability: 0.1
    export:
      zipkin:
        # F-40.12 分布式追踪: 上报到 Zipkin Server (docker run -d -p 9411:9411 openzipkin/zipkin)
        # 关闭(默认)时不导出, traceId 仍会注入日志 MDC, 可按日志串联链路
        enabled: false
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  propagation:
    # W3C Trace Context: traceparent 头跨服务传播, 与 Zipkin/Tempo 兼容
    type: w3c
