server:
  port: 8080

spring:
  application:
    name: java-agent

  # H2 数据库配置(开发期)
  datasource:
    url: jdbc:h2:file:./data/database/agent;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # WebFlux 配置
  codec:
    max-in-memory-size: 16MB

# ===== Agent 核心配置 =====
agent:
  name: "JavaAgent"

  # 分层 System Prompt（L1 全局 < L2 场景级 < L3 会话级）
  # 聊天场景：L1+L2 作为 system 消息插入 history；会话级 systemPrompt 非空时覆盖 L2/chat。
  # 文生图/图生图：L1+L2 作为前置增强拼到用户 prompt 前（图像模型协议不支持 system 消息）。
  system-prompt:
    # L1 全局默认（所有场景兜底，可为空）
    default-prompt: "你的名字叫：多吃点肉"
    scenes:
      # 聊天场景
      chat: "你是一个专业的智能问答助手。你的任务是根据用户的提问以及提供的【联网搜索结果】，给出准确、完整、排版优美的回答。
            【规则要求】：
            1. **信息整合**：仔细阅读【联网搜索结果】，提取与用户问题高度相关的信息。不要遗漏关键细节。
            2. **拒绝幻觉**：严格基于【联网搜索结果】回答，如果搜索结果中没有相关信息，请明确告知用户“根据目前的搜索结果，暂时无法回答该问题”，绝对不要自己编造。
            3. **结构完整**：回答要有逻辑，包含开头（直接回答核心问题）、正文（详细展开）、结论（总结或建议）。
            4. **排版优美**：必须使用 Markdown 格式进行排版，要求：
               - 使用 `###` 作为主标题。
               - 使用无序列表 `-` 或有序列表 `1.` 来展示要点或步骤。
               - 对于关键数据、专有名词，使用 `**加粗**` 突出显示。
               - 如果内容较多，请分点/分段说明，避免一大段文字挤在一起。
            5. **附带来源**：在回答的末尾，列出你引用的信息来源（仅列出实际用到的）。
            
            【输入信息】：
            - 用户问题：{user_question}
            - 联网搜索结果：{search_context}
            
            请根据以上信息，生成高质量回答："
      # 文生图场景增强（拼到用户 prompt 前）
      text-to-image: ""
      # 图生图场景增强（通常强调保持参考图主体）
      image-to-image: ""

  # 记忆配置
  memory:
    max-messages: 20
    storage: memory
    # 上下文上限提示: 估算 token 达到上限的 warn-ratio 时, 建议用户开启新对话
    context-token-limit: 8000
    context-warn-ratio: 0.8

  # 文件存储配置
  storage:
    base-dir: ./data
    image-dir: ./data/images
    video-dir: ./data/videos
    upload-dir: ./data/uploads
    upload-url-prefix: /api/files/uploads
    generated-dir: ./data/generated

  # 模型配置
  models:
    default-chat: "openai-chat"

    chat:
      - name: "openai-chat"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com"
        model: "gpt-4o"
        temperature: 0.7
        max-tokens: 2000
        capabilities:
#          - vision
#          - function_calling

      - name: "zhipu-chat"
        enabled: true
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "glm-4-plus"
        temperature: 0.7
        capabilities:
          - function_calling

      - name: "qwen-chat"
        enabled: true
        provider: "qwen"
        api-key: "sk-68a97d79d1f5479491be3ae83fa4655c"
        base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        model: "qwen3.7-max-2026-06-08"
        capabilities:
#          - vision
          - function_calling

      - name: "deepseek-chat"
        enabled: true
        provider: "deepseek"
        api-key: "sk-b8bb098d0a3a45508f86d7b5c8cd1b34"
        base-url: "https://api.deepseek.com"
        model: "deepseek-v4-flash"
        capabilities:
          - function_calling

    image:
      - name: "qwen-image"
        enabled: true
        provider: "qwen"
        #        api-key: ${DASHSCOPE_API_KEY:demo-key}
        api-key: "sk-68a97d79d1f5479491be3ae83fa4655c"
        base-url: "https://dashscope.aliyuncs.com"
        model: "qwen-image-2.0-pro-2026-06-22"
        size: "1024x1024"

      - name: "openai-image"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com"
        model: "dall-e-3"
        size: "1024x1024"

      - name: "zhipu-image"
        enabled: false
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "cogview-3"

    video:
      - name: "kling-video"
        enabled: true
        provider: "kuaishou"
        api-key: ${KLING_API_KEY:demo-key}
        base-url: "https://api.klingai.com"
        model: "kling-v1"

      # 阿里云百炼 通义万相2.7 文生视频(新版协议, 仅支持 wan2.7 系列)
      # 配置有效 DASHSCOPE_API_KEY(即百炼 API Key) 后将 enabled 改为 true
      # 如需北京地域专属域名可改 base-url 为 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
      - name: "wan-video"
        enabled: true
        provider: "wan"
#        api-key: ${DASHSCOPE_API_KEY:demo-key}
        api-key: "sk-68a97d79d1f5479491be3ae83fa4655c"
        base-url: "https://dashscope.aliyuncs.com"
        model: "wan2.7-t2v-2026-06-12"
        model-i2v: "happyhorse-1.1-i2v"   # 图生视频(i2v)专用模型名

    # 语音模型 (STT/TTS), V1.1 新增; 配置有效 OPENAI_API_KEY 后将 enabled 改为 true
    audio:
      - name: "openai-audio"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com"
        model: "whisper-1"

      # 阿里云百炼 Sambert 语音合成 (仅 TTS); 配置有效 DASHSCOPE_API_KEY 后将 enabled 改为 true
      # 注意: 百炼语音合成不支持本地音频 STT, 语音识别仍请使用 openai-audio
      - name: "qwen-audio"
        enabled: false
        provider: "qwen"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com"
        model: "sambert-zhide-v1"

# 工具配置
agent-tools:
  weather:
    enabled: true
    api-key: ${WEATHER_API_KEY:demo-key}
    base-url: "https://restapi.amap.com/v3/weather/weatherInfo"
  calculator:
    enabled: true
  time:
    enabled: true

# ===== MCP Server 连接配置 (本应用作为 Host, 连接外部 MCP Server) =====
# 只需写 Client 去访问别人提供的 MCP Server, 不需要自己起 Server。
# 下面为示例(默认注释): 启用时去掉注释, 并把 command 换成你实际可用的 MCP Server 启动命令。
# 注意: command 为 stdio 启动命令, 系统需能执行 npx/python 等。
mcp:
  servers:
    - name: web-search
      # Tavily 官方 MCP Server (stdio, 由 npx 拉起)
      # 需设置环境变量 TAVILY_API_KEY(如下), 否则 Server 启动后调用会报错:
      #   Windows(PowerShell):  $env:TAVILY_API_KEY='tvly-xxx'
      #   Linux/macOS:          export TAVILY_API_KEY='tvly-xxx'
      # 注: npx 拉起的子进程会继承本应用的环境变量, 故在启动 java-agent 前设置即可
      command: ["D:\\app\\nodejs\\npx.cmd", "-y", "tavily-mcp@0.2.1"]
      # 该 Server 暴露的工具名, 允许在流式对话中被调用
      streaming-tools: ["tavily-search", "tavily-extract"]
      # 把第三方工具名对齐到本项目约定: tavily-search -> web_search
      # 这样 AgentOrchestrator / 前端开关(都按 web_search 判断)无需改动
      aliases:
        tavily-search: web_search
        tavily-extract: web_extract

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
  packages-to-scan: com.dcdr.agent.controller
  default-flat-param-object: true

# 日志
logging:
  level:
    com.example.agent: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
