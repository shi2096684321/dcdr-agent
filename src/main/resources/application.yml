server:
  port: 8080
  # V3.0 F-40.6 优雅停机: 停机等待在途请求/SSE 处理完, 超时后强制退出
  shutdown: graceful

spring:
  application:
    name: dcdr-agent
  # 优雅停机每阶段等待上限 (可结合停机事件把 running 工作流标记为 interrupted)
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # 数据库连接一律由 profile 提供, 此处不再内置数据源:
  #   pg   → PostgreSQL + pgvector (生产与本地开发的唯一选择, 连接见 application-pg.yml)
  #   test → H2 内存库 (仅供测试, 见 src/test/resources/application-test.yml)
  # 故必须激活其中之一, 否则启动时会因找不到数据源而失败; 此处写死 pg,
  # 避免"忘记指定 profile 时静默回退到另一个库"这类隐患。
  profiles:
    active: pg
  # 说明: H2 已不再作为开发/生产数据库(仅测试期使用, 见 pom.xml 中该依赖的 test scope),
  #       原先此处的 H2 datasource 与 h2.console 配置已移除。
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # WebFlux 配置
  codec:
    max-in-memory-size: 16MB

  # V3.1 F-46 Redis 连接 (仅 agent.v3.cluster.backend=redis 时才会真正建立连接;
  # 默认 backend=memory 下 Lettuce 连接工厂惰性创建, 不会连接, 故此处有默认值也无副作用)
  # compose 内: REDIS_HOST=redis; 本机跑 jar: 默认 localhost:6379
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 集群协调是"尽力而为"的能力, 超时必须短 —— 否则 Redis 抖动会拖慢限流热路径
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 100ms

# ===== Agent 核心配置 =====
agent:
  name: "一人公司多模态 AI 助手工作台"

  # ── System Prompt 架构（两个正交维度）──────────────────────────────
  # 维度一 · Base System Prompt（静态基线）：L1 全局 < L2 场景级 < L3 会话级
  #   - L1 全局 default-prompt：所有场景兜底
  #   - L2 场景级 scenes.*：按 chat / text-to-image / image-to-image 注入
  #   - L3 会话级 SessionEntity.systemPrompt（DB 持久化）：聊天场景用户可定制，覆盖 L2/chat
  #   长文本建议外置到 classpath:prompts/*.txt，用 *-location 字段引用；内联字段优先。
  # 维度二 · Runtime 运行时约束（平台动态增强，不持久化，与 Base 层级正交）：
  #   由平台按运行时状态（联网搜索开关/多轮/生图工具）动态注入，每项 name(去重键)+text/text-location。
  # 聊天场景：维度一解析结果作为 system 消息插入 history 头部（OpenAI 兼容）。
  # 文生图/图生图：维度一作为前置增强拼到用户 prompt 前（图像模型不支持 system 消息）。
  system-prompt:
    # L1 全局默认（所有场景兜底，可为空）
    default-prompt: "在没有用户设置的角色的情况下你是一位全能的工作助手，你的名字叫dcdr（多吃点肉）,小名叫多肉。是石准将你创造出来的。不用每次回答都介绍自己"
    scenes:
      # 聊天场景：长文本外置到文件，改 prompt 只改 prompts/chat.txt 即可
      chat-location: "classpath:prompts/chat.md"
      # 也可内联覆盖（内联优先于 chat-location）：chat: "..."
      # 文生图场景增强（拼到用户 prompt 前）
      text-to-image: ""
      # 图生图场景增强（通常强调保持参考图主体）
      image-to-image: ""

    # 维度二 · Runtime 运行时约束（每项 name=去重键；text 内联优先，text-location 文件优先于内置默认）
    runtime:
      # 生图策略：约束只生成本轮新请求的图片，不重复历史已完成的图片
      image-policy:
        name: "runtime:image-policy"
        text-location: "classpath:prompts/runtime-image-policy.md"
      # 联网搜索引导：用户开启联网搜索时的检索与引用规范
      web-search:
        name: "runtime:web-search"
        text-location: "classpath:prompts/runtime-web-search.md"
      # 多轮对话规范：只回答当前提问、历史仅作参考，避免重复历史答案
      multi-turn:
        name: "runtime:multi-turn"
        text-location: "classpath:prompts/runtime-multi-turn.md"
      # RAG 知识库检索增强引导(用户选择知识库时注入, 检索片段由代码动态拼接)
      rag-context:
        name: "runtime:rag-context"
        text-location: "classpath:prompts/runtime-rag-context.md"

  # 记忆配置
  memory:
    max-messages: 6
    storage: memory
    # 上下文上限提示: 估算 token 达到上限的 warn-ratio 时, 建议用户开启新对话
    context-token-limit: 8000
    context-warn-ratio: 0.8

  # ===== V3.1 背景信息统一预算 =====
  # 长期记忆(agent.memory 召回后注入)与检索片段(agent.rag.inject)都注入 system 上下文,
  # 此前却各有限制、互不感知: 记忆只有条数上限(常驻 20 + 触发 10 条), 单条最多 1000 字符,
  # 最坏约 3 万字符; 检索片段有 6000 字符预算。两者叠加时"先砍谁"没有任何规则。
  #
  # 优先级: 记忆优先, 检索片段让位。理由是失效方式不同 —— 记忆砍掉会让同一个问题在不同轮次
  # 得到不一致的个性化回答(代价隐蔽); 检索片段本就按相关度降序, 砍的是尾部最不相关的部分。
  # 若要优先保住资料, 把 memory-max-chars 调小即可, 它会同时让出更多额度给检索片段。
  context:
    budget:
      # 两者合计字符上限(<= 0 表示不限制)。默认 9000 高于两类内容的常态占用(约 1~2k + 5k),
      # 也就是默认下这条不会触发 —— 新的预算只处理"以前没人处理"的叠加情况, 不改既有行为。
      background-max-total-chars: 9000
      # 长期记忆单独上限(<= 0 表示不限制)。默认 6000 与 agent.rag.inject.max-total-chars 相同:
      # 先保证任何一方都吃不到全局预算, 再由合计上限处理"两个都不超、加起来超"的那一段。
      memory-max-chars: 6000

  # ===== V3.1 F-47 工具结果体积治理 =====
  # 工具结果在「产出处」压缩一次(ToolResultCompressor), 回灌模型 / 下发前端 / 落库三处共用同一份文本。
  # max-length 默认与 V3.0 的 TOOL_RESULT_MAX_LEN 一致 → 升级后"上限"行为不变;
  # 本项修复的是 V3.0 的两个漏点(前端下发与 assistant 正文拼接未截断)与"只保头部"的缺陷。
  tools:
    result:
      # 单条工具结果字符上限(超出后保留头 70% + 尾 30%; 尾部常含结论/总计行/表格末尾)
      max-length: 6000
      # 单条 token 预算(0 = 不限); 比 max-length 更紧时生效。中文场景 1 字符 ≈ 1 token,
      # 6000 字符理论上可吃掉 6000 token, 需要更严时可设 3000 左右
      max-token-budget: 0
      # 尾部保留比例(0~0.5); 0 = 退回 V3.0 的纯头截断
      keep-tail-ratio: 0.3
      # 落库到 messages.sources 时单个来源正文上限(防 web_extract 整页正文把单行撑大)
      source-content-max-length: 4000
      # 回灌窗口内工具结果的 token 总量预算(0 = 不限): 单条已限长, 但多轮工具调用的合计仍可能超窗口
      window-token-budget: 6000
      # 窗口预算触顶后, 本轮单条结果的字符上限
      window-floor-length: 800
      summary:
        # LLM 摘要降级: 一次真实模型调用(有费用与延迟), 不需要可关掉 → 该档直接退化为硬截断
        enabled: true
        # 超过该字符数(且未达落盘阈值)时做摘要; 建议为 max-length 的 3 倍左右
        threshold: 20000
        # 摘要用模型(留空 = 系统默认对话模型; 建议用低成本模型)
        model: ""
      spill:
        enabled: true
        # 超过该字符数则全文落盘, 回灌只给"路径 + 规模 + 前 N 行", 模型用 tool_result_read 分页取全文
        threshold: 32768
        dir: ./data/tool-results
        head-lines: 30
        page-size: 200
        max-page-size: 1000
        # 落盘文件保留天数(0 = 不清理)
        retain-days: 7

  # ===== V2.2 用户认证配置 =====
  # enabled=false 时所有接口免鉴权(兼容 V2.1 单用户场景); 生产环境务必 enabled=true
  auth:
    enabled: true
    jwt:
      # HMAC-SHA256 密钥(>=32 字节); 生产环境通过环境变量 JWT_SECRET 注入, 避免硬编码泄露
      secret: ${JWT_SECRET:dcdr-agent-v22-default-secret-key-change-me-in-production-please-32bytes}
      access-ttl: 24h
      refresh-ttl: 7d
      issuer: dcdr-agent
    login-lock:
      max-failures: 5
      lock-ttl: 30m
    permit-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      # 注意: /api/models 不能加白名单 —— 白名单路径在 SecurityContextWebFilter 中直接放行、不解析 Token,
      # 导致 Controller 里 SecurityContext.getUserId() 恒为 null, 用户自定义模型无法追加进列表。
      # 走下方 /api/** authenticated() 规则, 登录后携带 Token 正常解析用户上下文 (V3.1)。
      - /v3/api-docs
      - /swagger-ui
      # 上传文件匿名访问: 用 Ant 通配 /** 放行所有子路径(图片 URL 形如 /api/files/uploads/2026/08/31/xxx.png)。
      # 仅写 /api/files/uploads(无 /**) 时, SecurityConfig.authorizeExchange 的 Ant pathMatchers 不匹配子路径,
      # 子路径会落到下方 /api/** authenticated() 被拦, 而浏览器 <img> 不带 token 导致 401 加载失败。
      - /api/files/uploads/**
      - /api/files/generated/**
      - /api/files/videos/**
      # F-40.2 健康检查/指标采集: 供负载均衡探活与 Prometheus 抓取 (部署于内网)
      - /actuator/health
      - /actuator/readiness
      - /actuator/liveness
      - /actuator/prometheus

  # ===== V2.1 RAG 知识库配置 =====
  # 真实向量检索依赖 pgvector, 仅在 pg profile 下可用(生产与本地开发均走 pg)。
  # 测试期的 H2 不支持 VECTOR 类型, 相关能力改由 RagVectorStoreIT(Testcontainers) 覆盖。
  rag:
    enabled: true
    # 平台级知识库 ID 列表(visibility=PLATFORM): 对所有对话无感可用, 用户无需选择
    # 管理员将知识库 visibility 设为 PLATFORM 后, 把 ID 填入此处即可全局生效
    platform-kb-ids: ["kb_1786443109991fff8909"]
    storage-dir: ./data/kb
    document:
      max-file-size: 20MB
      supported-formats: [pdf, docx, txt, md, markdown, html, htm]
      max-docs-per-kb: 100
    splitter:
      strategy: recursive
      chunk-size: 1000
      chunk-overlap: 200
    embedding:
      # 默认 Embedding provider; 维度必须 = 1536 (与 document_chunks.embedding VECTOR(1536) 一致)
      default-provider: qwen-embedding
      providers:
        # provider = 厂商(qwen/zhipu/openai); engine 约定同 models(langchain4j 默认 / manual 回退)
        # 通义 DashScope text-embedding-v4 (Qwen3-Embedding, 支持 1536 维, 与 schema VECTOR(1536) 对齐)
        # 注: v3 仅支持 1024/768/512 维, 传 1536 会 400; v4 是推荐模型, 支持 1536 且多语种更强
        - name: qwen-embedding
          enabled: true
          provider: qwen
          api-key: ${DASHSCOPE_API_KEY:demo-key}
          base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
          model: qwen3.7-text-embedding-flash
          dimensions: 1536
          # v4 单次请求最大 10 条(官方限制), v3 为 25; 此处按 v4 限制
          batch-size: 10
        # OpenAI text-embedding-3-small (1536 维); 配置有效 OPENAI_API_KEY 后启用
        # base-url 约定(两引擎一致): 版本段由 base-url 携带, 引擎在其后追加 /embeddings
        - name: openai-embedding
          enabled: false
          provider: openai
          api-key: ${OPENAI_API_KEY:sk-demo-key}
          base-url: https://api.openai.com/v1
          model: text-embedding-3-small
          dimensions: 1536
          batch-size: 100
        # 智谱 embedding-2 (1024 维, 与 schema VECTOR(1536) 不匹配, 启用前需同步改 schema 维度)
        - name: zhipu-embedding
          enabled: false
          provider: zhipu
          api-key: ${ZHIPU_API_KEY:demo-key}
          base-url: https://open.bigmodel.cn/api/paas/v4
          model: embedding-2
          dimensions: 1024
          batch-size: 64
    vector-store:
      type: pgvector
    retrieval:
      top-k: 5
      min-score: 0.3
      hybrid:                  # ← 第二层：混合检索
        enabled: true
        rrf-k: 60
      # ===== V3.2 相关性重排(Rerank): 默认关闭 =====
      # engine=dashscope: 百炼原生重排(QwenScoringModel + 官方 dashscope-sdk-java), 复用 DASHSCOPE_API_KEY
      # engine=openai   : OpenAI 兼容 /rerank 端点(自研适配器, 对接 Jina / Cohere / 自部署 bge-reranker)
      # 注意: 重排 relevance_score 是"单次请求内的相对分", 不可跨请求比较, min-score 按此语义理解
      rerank:
        enabled: false
        engine: dashscope
        model: qwen3.7-text-rerank
        # 留空走 SDK 默认端点; 需专属域名({WorkspaceId}.cn-beijing.maas.aliyuncs.com)时再填
        base-url: ${DASHSCOPE_RERANK_BASE_URL:}
        # 留空则重排 Bean 不注册(自动禁用)
        api-key: ${DASHSCOPE_API_KEY:}
        # 排序指令(可选, 仅 engine=dashscope 生效, 建议英文); 留空用模型默认(问答检索任务)
        instruct: ""
        # 重排后保留条数, 留空则用上方 top-k
        # max-results: 5
    # ===== V2.1 OCR 扫描版 PDF 文本提取 =====
    # 关闭时扫描版 PDF 直接报错(原 PdfReader 行为); 开启后自动降级调 qwen3.5-ocr
    # 复用 DASHSCOPE_API_KEY, 走 OpenAI 兼容协议 /chat/completions
    # 触发条件: PDFBox 抽取的"每页平均字符数" < threshold-chars-per-page 时判定为扫描版
    ocr:
      enabled: true
      api-key: ${DASHSCOPE_API_KEY:demo-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen3.5-ocr
      threshold-chars-per-page: 50
      max-pages: 50
      timeout-seconds: 300
      # 留空使用模型默认 prompt("只输出图像中的文本内容, 不附加描述或格式")
      prompt: ""

  # 文件存储配置
  storage:
    base-dir: ./data
    image-dir: ./data/images
    video-dir: ./data/videos
    upload-dir: ./data/uploads
    upload-url-prefix: /api/files/uploads
    generated-dir: ./data/generated

  # ===== V3.1 技能市场 (SkillHub) =====
  # 把 SkillHub(WorkBuddy 技能市场后端, https://lightmake.site)的"发现层"接进来:
  # 分类 / 列表 / 搜索 / 详情 / 版本历史 + 第三方安全扫描结论。这些接口公开、无需鉴权。
  #
  # ⚠️ 边界(决定了产品形态, 不要误解为"一键安装"):
  #   技能包的**正文**不在公开接口里 —— 客户端下载走私有通道, 实测
  #   /api/v1/skills/{slug}/download 对 GET/POST 均返回 405, 详情与版本响应也不含包地址。
  #   因此"引入"产出的是"元数据骨架 + 待补全正文", 并且以停用状态入库(补全正文后手工启用)。
  #   这样选是因为: 没有正文的技能若进入技能目录, 只会白占模型的判断预算。
  #
  # 默认关闭: 与 agent.v3.plugin / agent-tools.sandbox 同口径 —— 是否允许出网由部署方显式决定。
  # 关闭时市场接口返回明确提示, 且不发起任何外部请求(WebClient 也是惰性构建的)。
  skill:
    hub:
      enabled: true
      base-url: ${SKILL_HUB_BASE_URL:https://lightmake.site}
      # 出站超时(秒); 与 WorkBuddy 客户端保持一致(它自己是 10s)
      timeout-seconds: 10
      # 分类/详情/版本的内存缓存时长(秒): 把外部依赖从"每次点击"降为"每 TTL 一次"
      cache-ttl-seconds: 300
      # 单次请求条数上限(兜底, 防止前端传入超大 pageSize 打爆上游)
      # 实测上游 pageSize=100 可用、200 直接 400(且响应体为空), 故保守取 50;
      # 调高前请先实测, 上游对非法参数只回 400、不给任何原因。
      max-page-size: 50

  # 模型配置
  models:
    default-chat: "qwen-chat"
    # 用户自定义模型 apiKey 的 AES 加密主密钥; 生产环境通过环境变量 MODEL_API_KEY_SECRET 注入
    # (不可与其他密钥复用, 泄露会导致用户 apiKey 密文可被解出)
    api-key-secret: ${MODEL_API_KEY_SECRET:dcdr-agent-model-api-key-secret-change-me-32bytes}

    # provider = 厂商(qwen/zhipu/deepseek/openai/ollama), 用于 /api/models 展示与 manual 模式分发
    # engine 说明:
    #   langchain4j = 框架内核(默认, 适配任意 OpenAI 兼容端点, 在 base-url 后追加 /chat/completions)
    #   manual = 手写 WebClient 实现(回退选项)
    # 切换引擎只需改 engine 值
    chat:
      - name: "openai-chat"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        # base-url 约定(两引擎一致): 版本段由 base-url 携带, 引擎在其后追加 /chat/completions
        base-url: "https://api.openai.com/v1"
        model: "gpt-4o"
        temperature: 0.7
        max-tokens: 2000
        capabilities:
#          - vision
#          - function_calling

      - name: "zhipu-chat"
        enabled: true
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "glm-4-plus"
        temperature: 0.7
        capabilities:
          - function_calling

      - name: "qwen-chat"
        enabled: true
        provider: "qwen"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        model: "qwen3.7-flash-2026-07-15"
        capabilities:
#          - vision
          - function_calling

      - name: "deepseek-chat"
        enabled: true
        provider: "deepseek"
        api-key: ${DEEPSEEK_API_KEY:demo-key}
        base-url: "https://api.deepseek.com"
        model: "deepseek-v4-flash"
        capabilities:
          - function_calling

      # V3.0-rc F-38 本地模型: Ollama OpenAI 兼容端点 (私有化部署, 数据不出内网)
      # 前置: 安装 Ollama 并拉取模型 (ollama pull qwen3:8b), 然后 enabled 改 true
      - name: "ollama-chat"
        enabled: false
        provider: "ollama"
        # Ollama 本地无需鉴权, 占位即可
        api-key: "ollama"
        # Ollama 原生 OpenAI 兼容端点 (端口 11434, 需带 /v1)
        base-url: "http://localhost:11434/v1"
        model: "qwen3:8b"
        capabilities:
          - function_calling

    # provider = 厂商(qwen/zhipu/openai); engine 约定同 chat(langchain4j 默认 / manual 回退)
    # base-url 约定(两引擎一致): 版本段(/v1 等)由 base-url 携带, 路径只含资源部分, 切换引擎无需改地址
    #   智谱: https://open.bigmodel.cn/api/paas/v4 (cogview 系列)
    #   OpenAI: https://api.openai.com/v1 (dall-e 系列)
    # qwen 例外(端点本质不同, 配双地址):
    #   base-url        = langchain4j 引擎用 compatible-mode(注: DashScope 生图无兼容端点, 实测 404, 仅留作切换)
    #   manual-base-url = manual 引擎用 DashScope 原生根地址(multimodal-generation)
    image:
      - name: "qwen-image"
        enabled: true
        provider: "qwen"
        engine: "manual"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        manual-base-url: "https://dashscope.aliyuncs.com"
        model: "qwen-image-2.0-pro-2026-06-22"
        size: "1024x1024"

      - name: "openai-image"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com/v1"
        model: "dall-e-3"
        size: "1024x1024"

      - name: "zhipu-image"
        enabled: false
        provider: "zhipu"
        api-key: ${ZHIPU_API_KEY:demo-key}
        base-url: "https://open.bigmodel.cn/api/paas/v4"
        model: "cogview-3"

    video:
      - name: "kling-video"
        enabled: true
        provider: "kuaishou"
        api-key: ${KLING_API_KEY:demo-key}
        base-url: "https://api.klingai.com"
        model: "kling-v1"

      # 阿里云百炼 通义万相2.7 文生视频(新版协议, 仅支持 wan2.7 系列)
      # 配置有效 DASHSCOPE_API_KEY(即百炼 API Key) 后将 enabled 改为 true
      # 如需北京地域专属域名可改 base-url 为 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
      - name: "wan-video"
        enabled: true
        provider: "wan"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com"
        model: "wan2.7-t2v-2026-06-12"
        model-i2v: "happyhorse-1.1-i2v"   # 图生视频(i2v)专用模型名

    # 语音模型 (STT/TTS), V1.1 新增; 配置有效 OPENAI_API_KEY 后将 enabled 改为 true
    # provider = 厂商; engine 约定同 chat(langchain4j 默认 / manual 回退)
    # base-url 约定(两引擎一致): 版本段由 base-url 携带, 引擎在其后追加 /audio/*
    audio:
      - name: "openai-audio"
        enabled: false
        provider: "openai"
        api-key: ${OPENAI_API_KEY:sk-demo-key}
        base-url: "https://api.openai.com/v1"
        model: "whisper-1"

      # 阿里云百炼 Sambert 语音合成 (仅 TTS); 配置有效 DASHSCOPE_API_KEY 后将 enabled 改为 true
      # 注意: 百炼语音合成不支持本地音频 STT, 语音识别仍请使用 openai-audio
      - name: "qwen-audio"
        enabled: false
        provider: "qwen"
        api-key: ${DASHSCOPE_API_KEY:demo-key}
        base-url: "https://dashscope.aliyuncs.com"
        model: "sambert-zhide-v1"

  # ===== V3.0-alpha 配置 (F-30 智能路由 / F-31 触发层 / F-33 执行容错) =====
  v3:
    # F-30 智能路由层: LLM 自动判断用户意图, 路由到工作流/Agent/普通对话
    smart-routing:
      enabled: true
      # 置信度阈值 (0~1), 低于此值回退普通对话, 避免误路由
      confidence-threshold: 0.6
      # 路由用的模型名 (留空用系统默认对话模型; 建议用低成本模型降低延迟与费用)
      model: ""
      # 路由过程是否对用户可见 (下发"已自动选择 XX"提示)
      visible-hint: true
      # LLM 结构化输出约束
      #   json_object: 强制输出合法 JSON (默认, 兼容性最好 Qwen/DeepSeek/GLM/OpenAI)
      #                仅保证"是合法JSON", 不保证字段名/结构; 靠 prompt + 解析校验兜底
      #   json_schema: 按 JSON Schema strict 强约束字段 (字段名/类型/枚举/必填全保证)
      #                需模型支持 strict 模式 (gpt-4o / qwen-max 较新版 / 其他不保证)
      #                不支持的模型会返回 400, 切换前请确认路由模型能力
      #   tool_call:   把期望输出包装为工具并强制调用, 从 tool_calls arguments 取符合 schema 的 JSON
      #                schema 级保证, 国产模型 function calling 普遍支持 (Qwen/DeepSeek/GLM 推荐此模式)
      #                需模型支持 function calling
      #   留空: 不约束, 仅靠 prompt
      response-format: json_object
    # F-33 执行容错: 步骤未显式配置重试时的默认策略
    execution:
      retry:
        default-max-attempts: 3
        # 退避策略: fixed / linear / exponential
        backoff: exponential
        initial-delay-ms: 1000
        multiplier: 2.0
    # F-31 Webhook 触发层
    webhook:
      # Webhook 触发 URL 外部基址 (回显给用户用); 留空回显相对路径
      # 生产环境应填完整外网地址, 如: https://api.example.com/api/webhooks/trigger
      base-url: ""
    # F-39 成本与配额管理 (V3.0-beta): 用户级日/月 token 限额 + 工作流单次执行限额
    quota:
      # 是否启用配额拦截; 关闭时不做任何限额检查 (仅统计用量)
      enabled: false
      # 用户级: 单日 token 上限 (0 = 不限)
      daily-tokens: 100000
      # 用户级: 单月 token 上限 (0 = 不限)
      monthly-tokens: 2000000
      # 工作流级: 单次执行 token 上限 (0 = 不限); 超出时该执行标记 failed
      workflow-max-tokens-per-execution: 50000
      # 对话/Agent 级: 单次任务 token 上限 (0 = 不限); 跨工具轮累计达到后在轮次边界停止并收尾
      task-max-tokens: 50000

    # ===== V3.1 F-44.2 成本计价 (成本报表的金额来源) =====
    # 单位: 元 / 千 token。
    # 默认**不配置** (pricing 为空) 时: cost_amount 落 null, 报表以 token 口径为准、金额列显示 "—"。
    # 为什么不给默认值: 单价是"事实数据", 预设一组编造的价格会让错误的金额静默写进 llm_usage_logs,
    # 事后无法与真实计价区分 —— 宁可留空。请按实际采购价填写后启用。
    # 匹配规则: 精确匹配优先, 其次按前缀匹配 (配 "qwen" 可命中 qwen-max / qwen-plus 等变体)。
    cost:
      pricing: {}
      # 填写示例:
      # pricing:
      #   qwen-max:   { input: 0.02,   output: 0.06 }
      #   qwen-plus:  { input: 0.0008, output: 0.002 }
      #   deepseek:   { input: 0.001,  output: 0.002 }
      #   gpt-4o:     { input: 0.018,  output: 0.072 }

    # ===== V3.0-rc 生产化加固 (F-40.3/F-40.4) =====
    # F-40.3 API 限流: 固定窗口计数, 用户+IP 双维度 (未登录按 IP)
    rate-limit:
      enabled: false
      # 登录用户每分钟请求上限
      user-requests-per-minute: 60
      # 匿名/按 IP 每分钟请求上限 (保护未认证接口)
      ip-requests-per-minute: 120

    # ===== V3.1 F-46 多实例集群协调 (见 docs/16-多实例与高可用演练.md) =====
    # backend 同时控制两项集群级能力(两者都依赖"跨实例共享状态"):
    #   ① API 限流计数: memory=进程内计数(多实例会放大总限额 N 倍!) / redis=集中式计数
    #   ② 定时任务互斥: memory=每个实例都执行(多实例会重复执行) / redis=租约锁, 同一时刻仅一个实例执行
    # 默认 memory: 单实例部署行为与 V3.0 完全一致, 升级无感; 多实例部署必须改 redis。
    cluster:
      backend: memory
      # 实例标识: 租约锁的持有者标识, 也出现在日志里。留空自动生成(主机名 + 随机后缀);
      # 多实例部署建议显式指定(如 app-1 / app-2), 便于区分"谁在执行"。
      instance-id: ""
      # 定时任务租约 TTL(秒): 持有者崩溃后由 TTL 自动过期, 允许其他实例接管。
      # 需 >= 单次任务最长执行时间(工作流的 Agent 调用可能较久), 又不宜过大(崩溃后要等这么久才接管)。
      lock-ttl-seconds: 300

    # F-40.4 LLM 熔断: 按模型名统计失败率, 开断后快速失败 503
    circuit-breaker:
      enabled: false
      # 开断失败率阈值 (0~1, 窗口内调用数需达到 min-calls)
      failure-rate-threshold: 0.5
      # 统计窗口内最小调用数 (小样本不判定)
      min-calls: 10
      # 开断持续时间 (ms), 之后进入半开放行一次探测
      wait-open-ms: 30000

    # ===== V3.0-rc 业务能力 (F-36/F-37) =====
    # F-36 多租户: 租户级资源配额 (租户/成员由 TenantController 管理)
    tenant:
      enabled: false

    # F-37 插件系统: 外部 JAR 插件加载 (./plugins 目录)
    plugin:
      enabled: false
      # 插件目录 (相对工作目录)
      dir: "./plugins"
      # 危险 API 审计: 扫描插件字节码, 发现 Runtime/ProcessBuilder/反射特征即拒绝加载
      block-dangerous: true

# 工具配置
agent-tools:
  weather:
    enabled: true
    api-key: ${WEATHER_API_KEY:demo-key}
    base-url: "https://restapi.amap.com/v3/weather/weatherInfo"
  calculator:
    enabled: true
  time:
    enabled: true
  # V3.1 F-43 代码执行沙箱(OpenSandbox 自托管沙箱中间件客户端)
  # 本机开发默认: 直连宿主 18080 的 opensandbox-server(端口映射见 docker-compose.yml)。
  # 三项均支持环境变量覆盖, 且环境变量优先级高于此处默认值:
  #   AGENT_TOOLS_SANDBOX_ENABLED / OPEN_SANDBOX_DOMAIN / OPEN_SANDBOX_API_KEY
  # 注意: enabled 默认 true 仅为免去本机每次注入变量。『沙箱默认关闭』是 F-43 安全设计的
  #       一部分(见 TODO.md); 若该仓库要对外交付/部署, 请改回 false, 或在部署环境用
  #       环境变量 AGENT_TOOLS_SANDBOX_ENABLED=false 覆盖。
  sandbox:
    enabled: ${AGENT_TOOLS_SANDBOX_ENABLED:true}
    domain: ${OPEN_SANDBOX_DOMAIN:localhost:18080}
    api-key: ${OPEN_SANDBOX_API_KEY:dev-local-key-2026}
    protocol: http
    # 经由 Server 代理访问沙箱(客户端无法直连 docker bridge 内网 IP, 必须为 true)
    use-server-proxy: true
    python-image: python:3.12-slim
    # 沙箱存活超时(秒), 到期由服务端自动终止(兜底防泄漏)
    timeout-seconds: 30
    ready-timeout-seconds: 30
    # 单条命令执行超时(秒), 应小于 timeout-seconds
    execution-timeout-seconds: 10
    cpus: "1"
    memory: 512Mi
    # 代码长度上限 / 输出截断上限(与工具结果口径一致)
    max-code-length: 8000
    max-output-length: 6000
    max-concurrent: 2
    # 禁止沙箱出网(NetworkPolicy 默认 DENY)
    network-disabled: true
  # ===== V3.2 自建联网搜索(替代第三方 Tavily) =====
  # 由两个原生 Tool 提供能力, 工具名与原先 MCP 版本完全一致(web_search / web_extract),
  # 因此 Agent 编排层(硬编码按 web_search 判断)与前端联网开关均零改动:
  #   web_search  → SearXNG 元搜索(自托管, AGPL-3.0, 无 API Key, 无调用费用)
  #   web_extract → 抓取网页正文(crux = Mozilla Readability 移植 + flexmark 转 Markdown)
  # 前置条件: SearXNG 的 settings.yml 必须开启 search.formats: [html, json],
  #           否则 format=json 会被拒绝(403)。部署见 docker-compose.yml 的 searxng 服务。
  # 能力边界: 抓取不执行 JavaScript, 纯 SPA 站点提取不到正文(上游会降级为搜索摘要)。
  web:
    enabled: true
    # 本机跑 jar 用 localhost; 若应用跑在 compose 内则改为 http://searxng:8080
    searxng-url: ${AGENT_TOOLS_WEB_SEARXNG_URL:http://localhost:8888}
    language: zh-CN
    # 结果清洗管线会过滤掉大量聚合页(实测约砍掉一半), 故默认取 12 条以保证过滤后仍有足够条数
    max-results: 12
    max-results-limit: 15
    timeout-seconds: 15
    # 单页正文最大长度(字符), 超出截断
    max-content-length: 8000
    # 单次 web_extract 最多抓取的 URL 数
    max-extract-urls: 3
    # SSRF 防护: 拒绝环回/内网/链路本地(含云元数据 169.254.169.254)
    ssrf-guard: true

# ===== MCP Server 连接配置 (本应用作为 Host, 连接外部 MCP Server) =====
# 只需写 Client 去访问别人提供的 MCP Server, 不需要自己起 Server。
# 下面为示例(默认注释): 启用时去掉注释, 并把 command 换成你实际可用的 MCP Server 启动命令。
# 注意: command 为 stdio 启动命令, 系统需能执行 npx/python 等。
# V3.2: 原 Tavily(第三方收费 API + 需 npx/Node 子进程) 已由上方 agent-tools.web 的自建方案取代
#       (SearXNG 搜索 + crux 正文提取), 故 servers 置空。
#       如需临时切回 Tavily 做效果对比, 取消下方注释即可 ——
#       ⚠️ 两者注册的工具名相同(web_search / web_extract), ToolRegistry 为 Map 后者覆盖前者,
#          必须先关闭 agent-tools.web.enabled, 不可同时启用。
mcp:
  servers: []
  # - name: web-search
  #   command: ["D:\\app\\nodejs\\npx.cmd", "-y", "tavily-mcp@0.2.1"]
  #   streaming-tools: ["tavily-search", "tavily-extract"]
  #   aliases:
  #     tavily-search: web_search
  #     tavily-extract: web_extract

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
  packages-to-scan: com.dcdr.agent.controller,com.dcdr.agent.auth.contorller
  default-flat-param-object: true

# 日志
# F-40.12: 控制台格式带 traceId/spanId (Micrometer Tracing 开启时自动填充 MDC, 未开启时显示空)
logging:
  level:
    com.dcdr.agent: info
    org.springframework.ai: info
  pattern:
    # 注意: 读 MDC 必须用 %X{traceId}/%X{spanId}(Micrometer 注入到 MDC); ${traceId} 是属性占位符恒为空
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: ./logs/dcdr-agent.log
  logback:
    rollingpolicy:
      # F-40.6 日志轮转: 单文件 100MB, 保留 30 天 / 总量 2GB
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 2GB

# ===== F-40.2 / F-40.12 生产化加固: Actuator + 追踪 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      # 采样率 (0~1): 生产默认 0.1, 排障时可临时调 1.0
      probability: 0.1
  zipkin:
    tracing:
      # F-40.12 分布式追踪: 上报到 Zipkin Server (docker run -d -p 9411:9411 openzipkin/zipkin)
      # 注意: Spring Boot 3.3 的生效键是 management.zipkin.tracing.*;
      # 3.4 才改名为 management.tracing.export.zipkin.* —— 旧写法在此版本会静默失效(默认仍上报 localhost:9411)。
      # 设 ZIPKIN_EXPORT_ENABLED=false 可关闭上报; 关闭后 traceId 仍会注入日志 MDC 用于日志串联。
      enabled: ${ZIPKIN_EXPORT_ENABLED:true}
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  propagation:
    # W3C Trace Context: traceparent 头跨服务传播, 与 Zipkin/Tempo 兼容
    type: w3c
