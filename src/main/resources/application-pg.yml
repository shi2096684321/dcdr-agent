# V2.0 / V2.1 PostgreSQL + PgVector profile
# 启用方式: --spring.profiles.active=pg  (项目已在 application.yml 中将其写死为默认)
# 需先建库并执行 docs/sql/v2.0_schema.sql (含 pgvector 扩展)
spring:
  config:
    activate:
      on-profile: pg
  datasource:
    url: jdbc:postgresql://localhost:5432/dcdr_agent?currentSchema=public
    driver-class-name: org.postgresql.Driver
    username: dcdr_agent
    password: dcdr_agent
    # F-40.10 性能与扩展性: Hikari 连接池调优
    hikari:
      pool-name: dcdr-agent-pg
      # 池大小 = (核数 × 2) + 磁盘数, WebFlux 阻塞调用走 boundedElastic, 池不宜过大
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000       # 获取连接最大等待
      validation-timeout: 3000        # 校验连接毫秒数
      idle-timeout: 600000            # 10 分钟空闲回收
      max-lifetime: 1800000           # 30 分钟达到生命周期上限(需 < DB wait_timeout)
      leak-detection-threshold: 8000  # 8 秒未归还视为泄漏, 输出告警(生产建议开启定位连接泄漏)
  jpa:
    # V3.1: 表结构仍以 docs/sql/*.sql 为规范来源, 但启动时由 JPA 自动补齐"新增"的表/列/索引,
    #       免去每次加字段都要手工执行迁移脚本。update 只做 ADD(建缺失的表/列/索引), 不删列、
    #       不改已存在列的类型, 与"只新增"的预期一致; pgvector 的 vector(1536) 列因实体侧显式
    #       声明了 columnDefinition, 不会被误改。
    #       代价: JPA 生成的 DDL 不含 COMMENT、部分索引(WHERE)与 DESC 排序索引 —— 需要这些特性时
    #       仍执行 docs/sql/*.sql 补齐(脚本均为 IF NOT EXISTS, 重复执行安全)。
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # F-40.10 慢查询定位: 默认关, 排障时置 true 会在 session 关闭打印执行统计(含各查询耗时)。
        # 生产级慢查询看 PostgreSQL 的 auto_explain / pg_stat_statements(见 docs 部署文档)。
        generate_statistics: ${HIBERNATE_STATISTICS:false}
    open-in-view: false

# PgVector 向量检索相关配置 (V2.0 RAG 向量库)
agent:
  vector-store:
    provider: pgvector
    # 嵌入维度, 需与 v2.0_schema.sql 中 document_chunks.embedding 维度一致
    embedding-dim: 1536
    # 相似度检索返回条数
    top-k: 5
