[package]
name = "stepboy-pet"
version = "0.1.0"
description = "Lightweight configurable desktop pet"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stepboy_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 空默认值：开发时仍走 devUrl（配合 dev-server 热重载）
default = []
# 打包标记：启用后前端资源内嵌进 exe，不再依赖 devUrl。
# 构建正式版必须带上：cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

# 体积优化：体积优先 + LTO + 去符号，12 MB → 约 5-6 MB
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation"
] }
