<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    桌宠图标 · 小尺寸版（仅用于 ico 里的 16px / 24px 帧）
    为什么不直接缩放完整版：16px 只有 256 格像素，完整版的呆毛、刘海锯齿、腮红、
    耳朵全部糊成一团，脸的占比也太小。这一版刻意做四件事——
      1. 去掉呆毛、耳朵、腮红、发丝高光（这个尺寸看不见，只会制造噪点）
      2. 头发下沿上移，把脸的面积放大到接近一半
      3. 眼镜框和眼睛同步放大，眼睛填满镜片
      4. 白 T 加大，让小尺寸下底部有一条干净的亮色
    改完请运行：python tools/make-icon.py
  -->
  <defs>
    <linearGradient id="bgSmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB0EC"/>
      <stop offset="1" stop-color="#4878BC"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="54" fill="url(#bgSmall)"/>

  <path d="M30 260 C34 196 78 172 128 170 C178 172 222 196 226 260 Z" fill="#F9F8F1"/>

  <ellipse cx="128" cy="124" rx="73" ry="69" fill="#F8D7AF"/>

  <path d="M55 128
           C48 84 68 48 128 44
           C188 48 208 84 201 128
           L193 112 L183 130 L173 108 L161 128 L151 106 L138 126
           L124 106 L112 128 L102 108 L90 130 L80 110 L70 128 Z"
        fill="#2B271F"/>

  <g fill="none" stroke="#D2D9E2" stroke-width="14">
    <circle cx="97" cy="146" r="30"/>
    <circle cx="159" cy="146" r="30"/>
  </g>
  <line x1="120" y1="144" x2="136" y2="144" stroke="#D2D9E2" stroke-width="13" stroke-linecap="round"/>

  <circle cx="97" cy="148" r="17" fill="#3B2A1D"/>
  <circle cx="159" cy="148" r="17" fill="#3B2A1D"/>
  <circle cx="103" cy="141" r="5.5" fill="#FFFFFF"/>
  <circle cx="165" cy="141" r="5.5" fill="#FFFFFF"/>

  <path d="M116 190 Q128 199 140 190" stroke="#96613F" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
