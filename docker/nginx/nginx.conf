# dcdr-agent V3.1 F-46 多实例演练入口（7 层转发）
#
# 设计要点（都是本项目实际踩过的坑）：
#   1. SSE/流式必须关缓冲 —— 见 proxy_buffering 处的说明。
#   2. 必须透传 X-Forwarded-For —— RateLimitWebFilter.resolveClientIp 优先读它，
#      不传则所有匿名请求都会被算成 nginx 的容器 IP，限流会对全场用户一起生效。
#   3. 不需要粘滞会话(ip_hash) —— 认证是 JWT 无状态、会话数据在 PostgreSQL，
#      任一实例都能处理任一请求；SSE 单条连接天然绑定一个 upstream，不受轮询影响。
#   4. worker 起 1 个即可：这是本地演练入口，不是生产网关。

worker_processes 1;
# 前台运行的容器里，日志直接打到 stdout/stderr 更便于 docker logs 查看
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;

    # 响应里默认会带 nginx 版本，无必要暴露
    server_tokens off;

    # ⚠️ 必须显式 include：本文件是**整份替换**默认 nginx.conf，不是叠加 ——
    # 默认配置里的这一行随默认文件一起没了。缺了它，图片/视频等静态文件会以
    # application/octet-stream 下发，浏览器拒绝内联渲染（<img>/<video> 直接显示不出来）。
    # 这是"整份替换默认配置"最容易漏的一行（review 发现）。
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 知识库上传：主应用侧 application.rag.document.max-file-size 默认 20MB，这里给足余量
    client_max_body_size 64m;

    upstream dcdr_agent {
        # 两个应用实例，默认轮询
        server agent:8080       max_fails=2 fail_timeout=10s;
        server agent-2:8080     max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        # 健康检查探针走这里，便于 LB 排障
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://dcdr_agent;

            # SSE 需要 HTTP/1.1 + 清空 Connection（否则默认 close，长连接会被断续）
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── 流式对话的关键三行 ──
            # 关缓冲：否则 nginx 会等整个响应结束才转发，SSE 的"边生成边推送"完全失效
            proxy_buffering off;
            proxy_cache off;
            # 长读超时：一轮 Agent 多轮工具调用可能数分钟不产出新字节，默认 60s 会被掐断
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 分块传输：配合 proxy_buffering off，让增量尽快下发
            chunked_transfer_encoding on;
        }
    }
}
