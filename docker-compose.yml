# dcdr-agent 运行依赖编排（仅中间件，不含应用本身）
#
# 定位：本文件只负责"应用跑起来所依赖的东西"，方便单独启停、单独升级。
#       应用本体（agent）在 docker-compose.app.yml 中，两者通过同一个外部网络 dcdr-net 互通。
#
#   只想起依赖（本机 IDEA / mvn spring-boot:run 跑应用）：
#       docker compose up -d
#   连同应用一起用容器跑：
#       docker compose up -d && docker compose -f docker-compose.app.yml up -d --build
#   全部停止（保留数据）：
#       docker compose -f docker-compose.app.yml down && docker compose down
#
# 组件清单：
#   postgres  (pgvector/pgvector:pg16)  业务库 + 向量库，首次建库自动执行 docs/sql/*.sql
#   redis     (redis:7-alpine)          分布式限流计数 / 定时任务租约锁 / 缓存
#   zipkin    (openzipkin/zipkin)       链路追踪，应用上报 span
#   searxng   (searxng/searxng)         自建联网搜索（替代第三方 Tavily，无 API Key）
#   opensandbox-server                  代码执行沙箱服务端（可选能力，应用不依赖它启动）
#
# ===== 数据安全（V3.1，2026-09-28 事故后确立）=====
# PG 数据用命名卷 pgdata，但**必须每日 pg_dump 落到宿主机可见目录**（./data/backup）。
# 原因：命名卷物理上在 Docker VM 的 vhdx 里，Docker Desktop 重置/重装会连数据一起消失
# （2026-09-28 已实际发生，业务数据全丢）。备份脚本见 scripts/backup-db.ps1。
# ⚠️ PG 数据**不能**直接 bind mount 到 Windows 宿主目录 —— 实测 initdb 报
#    `data directory has invalid permissions (should be u=rwx (0700))`，
#    Docker Desktop 的宿主目录共享层不保留 Unix 权限位。
#
# ===== 环境约束（本机）=====
# Docker Desktop 的 dataFolder 与 Hyper-V VM 配置路径都必须在 E 盘：
# C 盘空间不足时 VM 的 .VMRS 内存文件写不下，VM 启动失败(0x80070070)。
# 本机 Docker 为 20.10.8 时存在旧 seccomp 拦截 glibc clone3 的问题，
# 故 postgres / searxng / opensandbox-server 必须 seccomp=unconfined（见各服务注释）。

name: dcdr-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dcdr-agent-pg
    # Docker 20.10.8 旧 seccomp profile 不兼容 Bookworm glibc 的 clone3 系统调用，
    # 导致 initdb popen fork 时 ENOMEM。seccomp=unconfined 绕过此限制。
    security_opt:
      - seccomp=unconfined
    # Hyper-V 后端 Docker VM 仅 4GB 内存，本地 pgvector 开发用 256m shm + 1g 内存足够
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      POSTGRES_DB: dcdr_agent
      POSTGRES_USER: dcdr_agent
      POSTGRES_PASSWORD: dcdr_agent
    ports:
      - "5432:5432"
    volumes:
      # 全量初始化：initdb 目录里的脚本在**首次建库**（数据卷为空）时按文件名字母序执行，
      # 故全新部署无需手工执行任何 SQL。01/02/03 前缀就是排序用。
      # 已有数据卷不会重跑；应用侧另有 ddl-auto=update 兜底补表。
      - ./docs/sql/v2.0_schema.sql:/docker-entrypoint-initdb.d/01_v2.0_schema.sql:ro
      - ./docs/sql/v3.0_schema.sql:/docker-entrypoint-initdb.d/02_v3.0_schema.sql:ro
      - ./docs/sql/v3.1_schema.sql:/docker-entrypoint-initdb.d/03_v3.1_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
      # 备份落点：容器内 /backup <-> 宿主机 <项目>/data/backup
      - ./data/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcdr_agent -d dcdr_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcdr-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dcdr-agent-redis
    ports:
      - "6379:6379"
    volumes:
      # 落项目 data 目录（宿主可见），不写死盘符 —— 写死 E:/ 会让 compose 在
      # Linux/WSL 宿主下解析成非法路径，换机器直接失效
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dcdr-net
    restart: unless-stopped

  # 分布式追踪，接收应用上报的链路数据
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: dcdr-agent-zipkin
    ports:
      - "9411:9411"
    # 内存存储够本地/开发排障，重启即清空；需持久化可挂卷
    volumes:
      - zipkindata:/data
    networks:
      - dcdr-net
    restart: unless-stopped

  # 自建联网搜索（替代第三方 Tavily）
  # SearXNG 元搜索引擎：AGPL-3.0、无 API Key、无调用费用，结果聚合多引擎。
  # 应用侧两个原生 Tool 调用：GET http://<host>:8888/search?q=...&format=json
  # （需 settings.yml 开启 json 格式，见 docker/searxng/settings.yml）
  searxng:
    image: searxng/searxng:latest
    container_name: dcdr-agent-searxng
    ports:
      # 宿主 8888 -> 容器 8080，避开应用的 8080
      - "8888:8080"
    volumes:
      # 配置以挂载方式提供：改配置只需重启容器，无需重建镜像
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_BASE_URL=http://localhost:8888/
    # 与 postgres 同因：旧 seccomp 拦 clone3 导致 Python 线程创建失败
    security_opt:
      - seccomp=unconfined
    networks:
      - dcdr-net
    restart: unless-stopped

  # 代码执行沙箱服务端（V3.1 F-43，自托管，非第三方 SaaS）
  # 架构：agent(业务) --HTTP--> 本组件 --docker--> 沙箱容器
  # 关键：docker.sock 只挂给本组件，业务应用零特权
  opensandbox-server:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: dcdr-opensandbox-server:1.1.0
    container_name: dcdr-opensandbox-server
    ports:
      # 宿主 18080 -> 容器 8080
      - "18080:8080"
    environment:
      # API Key：优先于配置文件里的 [server] api_key，生产环境务必用 .env 覆盖
      OPENSANDBOX_SERVER_API_KEY: ${SANDBOX_API_KEY:-change-me-in-env}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # 本组件需要指挥宿主 docker 拉起沙箱容器；沙箱逃逸的最坏影响限于本组件与宿主 docker
      - /var/run/docker.sock:/var/run/docker.sock
      # 服务端元数据（snapshot / 模板目录，SQLite）持久化
      - opensandbox-data:/var/lib/opensandbox
      # 配置挂载提供：改配置只需重启容器
      - ./sandbox/sandbox.toml:/etc/opensandbox/config.toml:ro
    # 必须用 Docker 默认 bridge，两个硬约束（都实测过）：
    #   ① networkPolicy(禁网) 仅在 network_mode='bridge' 下被支持，自定义网络会 400
    #      SANDBOX::INVALID_PARAMETER；
    #   ② server 与沙箱必须同处 docker0 才能直连 execd 端口，否则健康检查 502
    #      BACKEND_CONNECTION_FAILED。
    # 代价：脱离 compose 自定义网络 → 应用改为经宿主端口访问本服务
    # （见 docker-compose.app.yml 的 OPEN_SANDBOX_DOMAIN）。
    network_mode: "bridge"
    # 同 postgres 原因：旧 seccomp 拦 clone3，Python 服务端启动期必需线程
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    # 沙箱是可选能力，故应用不 depends_on 本服务 —— 它起不来，主应用照常提供服务

volumes:
  pgdata:
    driver: local
  zipkindata:
    driver: local
  # F-43: Sandbox Server 元数据（snapshot / 模板目录）
  opensandbox-data:
    driver: local

# 固定网络名（不随目录名变化），供 docker-compose.app.yml 以 external 方式接入。
# 应用容器通过服务名访问：postgres:5432 / redis:6379 / zipkin:9411 / searxng:8080
networks:
  dcdr-net:
    name: dcdr-net
    driver: bridge
